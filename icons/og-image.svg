<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <!-- Фон -->
        <radialGradient id="bgGlow1" cx="15%" cy="20%" r="60%">
            <stop offset="0%" stop-color="#4a7bff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bgGlow2" cx="90%" cy="80%" r="55%">
            <stop offset="0%" stop-color="#c46eff" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
        </radialGradient>

        <!-- Градиент иконки -->
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a7bff"/>
            <stop offset="55%" stop-color="#7a6eff"/>
            <stop offset="100%" stop-color="#c46eff"/>
        </linearGradient>

        <!-- Градиент заголовка -->
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#c7d2fe"/>
        </linearGradient>

        <!-- Тени -->
        <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
        </filter>
        <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Фон -->
    <rect width="1200" height="630" fill="#0a0f1a"/>
    <rect width="1200" height="630" fill="url(#bgGlow1)"/>
    <rect width="1200" height="630" fill="url(#bgGlow2)"/>

    <!-- Декоративные точки (сетка) -->
    <g opacity="0.15">
        <circle cx="80" cy="80" r="1.5" fill="#6d8cff"/>
        <circle cx="160" cy="80" r="1.5" fill="#6d8cff"/>
        <circle cx="240" cy="80" r="1.5" fill="#6d8cff"/>
        <circle cx="80" cy="160" r="1.5" fill="#6d8cff"/>
        <circle cx="160" cy="160" r="1.5" fill="#6d8cff"/>
        <circle cx="1120" cy="550" r="1.5" fill="#c46eff"/>
        <circle cx="1040" cy="550" r="1.5" fill="#c46eff"/>
        <circle cx="960" cy="550" r="1.5" fill="#c46eff"/>
        <circle cx="1120" cy="470" r="1.5" fill="#c46eff"/>
    </g>

    <!-- Иконка TaskFlow -->
    <g transform="translate(90, 195)">
        <!-- Основной квадрат -->
        <rect x="0" y="0" width="240" height="240" rx="58" ry="58"
              fill="url(#iconGrad)"
              filter="url(#iconShadow)"/>

        <!-- Блик -->
        <path d="M 58 0 L 182 0 Q 240 0 240 58 L 240 92 Q 120 70 0 96 L 0 58 Q 0 0 58 0 Z"
              fill="#ffffff" fill-opacity="0.35"/>

        <!-- Обводка -->
        <rect x="0" y="0" width="240" height="240" rx="58" ry="58"
              fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

        <!-- Буква T -->
        <path d="M 62 78
                 L 128 78
                 Q 134 78 134 84
                 L 134 92
                 Q 134 98 128 98
                 L 104 98
                 L 104 158
                 Q 104 164 98 164
                 L 84 164
                 Q 78 164 78 158
                 L 78 98
                 L 62 98
                 Q 56 98 56 92
                 L 56 84
                 Q 56 78 62 78 Z"
              fill="#ffffff"/>

        <!-- Буква F -->
        <path d="M 142 78
                 L 196 78
                 Q 202 78 202 84
                 L 202 92
                 Q 202 98 196 98
                 L 178 98
                 L 178 112
                 L 192 112
                 Q 198 112 198 118
                 L 198 126
                 Q 198 132 192 132
                 L 178 132
                 L 178 158
                 Q 178 164 172 164
                 L 158 164
                 Q 152 164 152 158
                 L 152 98
                 L 142 98
                 Q 136 98 136 92
                 L 136 84
                 Q 136 78 142 78 Z"
              fill="#ffffff"/>
    </g>

    <!-- Заголовок TaskFlow -->
    <text x="380" y="270"
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="86"
          font-weight="700"
          letter-spacing="-2"
          fill="url(#titleGrad)">
        TaskFlow
    </text>

    <!-- Подзаголовок -->
    <text x="380" y="330"
          font-family="Inter, -apple-system, sans-serif"
          font-size="32"
          font-weight="400"
          fill="#a8b8ff">
        Премиум планировщик задач
    </text>

    <text x="380" y="372"
          font-family="Inter, -apple-system, sans-serif"
          font-size="32"
          font-weight="400"
          fill="#a8b8ff">
        и трекер привычек
    </text>

    <!-- Особенности -->
    <g transform="translate(380, 440)">
        <!-- Пункт 1 -->
        <circle cx="10" cy="0" r="4" fill="#6d8cff"/>
        <text x="30" y="6"
              font-family="Inter, -apple-system, sans-serif"
              font-size="22"
              font-weight="500"
              fill="#c7d2fe">
            Работает офлайн
        </text>

        <!-- Пункт 2 -->
        <circle cx="280" cy="0" r="4" fill="#6d8cff"/>
        <text x="300" y="6"
              font-family="Inter, -apple-system, sans-serif"
              font-size="22"
              font-weight="500"
              fill="#c7d2fe">
            Данные локально
        </text>

        <!-- Пункт 3 -->
        <circle cx="540" cy="0" r="4" fill="#6d8cff"/>
        <text x="560" y="6"
              font-family="Inter, -apple-system, sans-serif"
              font-size="22"
              font-weight="500"
              fill="#c7d2fe">
            Бесплатно
        </text>
    </g>

    <!-- Декоративная линия снизу -->
    <rect x="90" y="560" width="1020" height="1"
          fill="#6d8cff" fill-opacity="0.15"/>

    <!-- Текст сайта -->
    <text x="90" y="595"
          font-family="Inter, -apple-system, sans-serif"
          font-size="18"
          font-weight="500"
          fill="#5a6a8c"
          letter-spacing="0.5">
        taskflow.app
    </text>

    <!-- Бейдж справа снизу -->
    <g transform="translate(920, 570)">
        <rect x="0" y="0" width="190" height="40" rx="20"
              fill="rgba(109,140,255,0.12)"
              stroke="rgba(109,140,255,0.3)"
              stroke-width="1"/>
        <text x="95" y="26"
              font-family="Inter, -apple-system, sans-serif"
              font-size="16"
              font-weight="600"
              fill="#a8b8ff"
              text-anchor="middle">
            ⚡ PWA · Офлайн
        </text>
    </g>
</svg>